<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="container">
        <div class="progress">
            Question <span id="current">1</span> of <span id="total">51</span>
        </div>

        <div id="quiz">
        </div>

        <div id="results">
            <h2>Quiz Results</h2>
            <div class="score">
                Score: <span id="score">0</span>/51
            </div>
            <div id="answers-review"></div>
            <button id="restart">Restart Quiz</button>
        </div>
    </div>

    <footer class="footer">
        <p class="footer-message">Başarılar. <a href="https://gorkem.codes">-gorkem</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
